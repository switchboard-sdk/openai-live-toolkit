name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      # npm trusted publishing and provenance
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      # Node 22 bundles npm 10; trusted publishing needs npm 11.5.1 or later.
      - name: Publish
        run: |
          spec="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          if npm view "$spec" version > /dev/null 2>&1; then
            echo "$spec is already on npm"
            exit 0
          fi
          # npm 11 wants a tag for a prerelease. There's no stable release yet, so a beta is latest.
          npx --yes npm@11 publish --tag latest
