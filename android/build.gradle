// React Native Android library module for OpenAILiveToolkit.
//
// Provides codegen for the TurboModule spec, the Android platform glue, and the
// Switchboard SDK + extensions. The shared C++ TurboModule (../cpp) is compiled
// and registered in the *consuming app's* native build via RN's C++ autolinking —
// see react-native.config.js (android cxx* keys) and android/CMakeLists.txt. The
// app therefore links Switchboard through Prefab; this module makes the AARs (and
// their Prefab packages) available to it via `api`.
apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

// From the Synervoz Maven repository, which the app's repositories need too.
// An app can pick another version with `switchboardVersion` in its root ext.
def switchboardVersion = safeExtGet("switchboardVersion", "3.3.0")

react {
    // Codegen reads the TurboModule spec from the package's TS sources and
    // generates RNOpenAILiveToolkitSpec (matches package.json codegenConfig.name).
    jsRootDir = file("../src/")
    libraryName = "RNOpenAILiveToolkitSpec"
    codegenJavaPackageName = "com.synervoz.openailivetoolkit"
}

android {
    namespace "com.synervoz.openailivetoolkit"
    compileSdk safeExtGet("compileSdkVersion", 35)

    defaultConfig {
        minSdkVersion safeExtGet("minSdkVersion", 24)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

repositories {
    mavenCentral()
    google()
    maven { url "https://s3.amazonaws.com/synervoz-android-maven-repository" }
}

dependencies {
    implementation "com.facebook.react:react-android"

    // `api` so the Switchboard AARs (and their Prefab packages) are visible to
    // the consuming app's native build, which is where our cpp is compiled.
    api "com.synervoz.switchboard:switchboardsdk:${switchboardVersion}"
    api "com.synervoz.switchboard.extensions:openai:${switchboardVersion}"
    // Silero VAD and the Onnx runtime it runs on, for idle mode.
    api "com.synervoz.switchboard.extensions:onnx:${switchboardVersion}"
    api "com.synervoz.switchboard.extensions:silerovad:${switchboardVersion}"
}
